<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar-Rechner – Lohnt sich eine PV-Anlage?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f1117;
      --card:         #1a1d27;
      --border:       #2d3148;
      --accent:       #f59e0b;
      --accent-dim:   rgba(245,158,11,0.12);
      --accent-glow:  rgba(245,158,11,0.25);
      --success:      #22c55e;
      --success-dim:  rgba(34,197,94,0.12);
      --error:        #ef4444;
      --error-dim:    rgba(239,68,68,0.12);
      --warning:      #f97316;
      --warning-dim:  rgba(249,115,22,0.12);
      --text:         #e2e8f0;
      --muted:        #94a3b8;
      --subtle:       #475569;
      --radius:       16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px;
      line-height: 1.5;
    }

    .app { width: 100%; max-width: 580px; }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 16px 0 28px;
    }
    .header-sun {
      font-size: 52px;
      display: block;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 20px rgba(245,158,11,0.5));
      animation: pulse-sun 3s ease-in-out infinite;
    }
    @keyframes pulse-sun {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(245,158,11,0.5)); }
      50%       { filter: drop-shadow(0 0 35px rgba(245,158,11,0.8)); }
    }
    .header h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .header p  { color: var(--muted); font-size: 15px; }

    /* ── Progress ── */
    .progress-wrap { margin-bottom: 24px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .progress-track {
      height: 3px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #fbbf24);
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }

    /* ── Wizard Card ── */
    .wizard-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
    }
    .step-fade {
      animation: stepIn 0.28s cubic-bezier(.4,0,.2,1);
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .step-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border-radius: 6px;
      padding: 3px 9px;
      margin-bottom: 14px;
    }
    .step-title { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
    .step-hint  { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    /* ── Slider Steps ── */
    .value-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }
    .value-big {
      background: var(--accent-dim);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      min-width: 130px;
      text-align: center;
      letter-spacing: -1px;
    }
    .value-unit { font-size: 15px; color: var(--muted); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 5px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 0 5px var(--accent-glow);
      transition: box-shadow 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 8px var(--accent-glow);
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }
    .slider-ends {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--subtle);
      margin-top: 6px;
    }
    .manual-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .manual-input label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 8px 12px;
      width: 100px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus { border-color: var(--accent); }
    .manual-input span { font-size: 14px; color: var(--muted); }

    /* ── Dachform Grid ── */
    .dachform-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dachform-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      cursor: pointer;
      padding: 18px 12px;
      text-align: center;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .dachform-btn:hover { border-color: var(--accent); color: var(--text); }
    .dachform-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    .dachform-btn.active .df-name { color: var(--accent); }
    .df-icon { font-size: 36px; line-height: 1; }
    .df-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .df-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

    /* ── Direction Grid ── */
    .compass-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .dir-counter {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-align: center;
      margin-bottom: 12px;
      padding: 6px 12px;
      background: var(--accent-dim);
      border-radius: 20px;
      display: inline-block;
      align-self: center;
      width: 100%;
    }
    .dir-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 14px 6px;
      text-align: center;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .dir-btn:hover:not(.disabled) { border-color: var(--accent); color: var(--text); }
    .dir-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .dir-btn.disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }
    .compass-center {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      opacity: 0.25;
    }
    .dir-arrow { font-size: 20px; }
    .dir-label { font-size: 11px; }
    .optimal-badge {
      font-size: 9px;
      background: var(--accent);
      color: #0f1117;
      border-radius: 4px;
      padding: 1px 5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ── Dropdown ── */
    .select-wrap { position: relative; }
    select {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      padding: 14px 44px 14px 16px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
      appearance: none;
    }
    select:focus { border-color: var(--accent); }
    .select-arrow {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
    }

    /* ── Toggle (Ja/Nein) ── */
    .toggle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .toggle-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      padding: 22px 12px;
      text-align: center;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      line-height: 1.3;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
    .toggle-btn.active-yes {
      background: var(--success-dim);
      border-color: var(--success);
      color: var(--success);
    }
    .toggle-btn.active-no {
      background: rgba(71,85,105,0.2);
      border-color: var(--subtle);
      color: var(--muted);
    }
    .toggle-icon { font-size: 34px; }

    /* ── Nav Buttons ── */
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 12px 18px;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-back:hover { border-color: var(--muted); color: var(--text); }
    .btn-next {
      flex: 1;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #0a0b0f;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 13px 24px;
      transition: all 0.18s;
    }
    .btn-next:hover:not(:disabled) {
      background: #fbbf24;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-next:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── RESULTS ── */
    .results { animation: stepIn 0.35s cubic-bezier(.4,0,.2,1); }

    .verdict {
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 18px;
      border: 1px solid transparent;
    }
    .verdict.good    { background: var(--success-dim);  border-color: rgba(34,197,94,0.3);   }
    .verdict.ok      { background: var(--warning-dim);  border-color: rgba(249,115,22,0.3);  }
    .verdict.bad     { background: var(--error-dim);    border-color: rgba(239,68,68,0.3);   }
    .verdict-icon    { font-size: 50px; display: block; margin-bottom: 12px; }
    .verdict-title   { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .verdict.good .verdict-title { color: var(--success); }
    .verdict.ok   .verdict-title { color: var(--warning); }
    .verdict.bad  .verdict-title { color: var(--error);   }
    .verdict-sub  { font-size: 14px; color: var(--muted); max-width: 380px; margin: 0 auto; }

    /* ── Metric Grid ── */
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
    }
    .metric.wide { grid-column: 1 / -1; }
    .m-label { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .m-value { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.1; }
    .m-value.pos { color: var(--success); }
    .m-value.neg { color: var(--error); }
    .m-sub  { font-size: 12px; color: var(--subtle); margin-top: 5px; }

    /* ── Chart ── */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 18px 16px;
      margin-bottom: 18px;
    }
    .chart-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Details Toggle ── */
    .details-toggle {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 10px 16px;
      text-align: left;
      transition: all 0.18s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .details-toggle:hover { border-color: var(--muted); color: var(--text); }
    .details-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
      display: none;
    }
    .details-panel.open { display: block; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row span:last-child { color: var(--text); font-weight: 500; }

    /* ── Reset ── */
    .btn-reset {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 12px;
      transition: all 0.18s;
    }
    .btn-reset:hover { border-color: var(--muted); color: var(--text); }

    .disclaimer {
      text-align: center;
      font-size: 12px;
      color: var(--subtle);
      margin-top: 20px;
      line-height: 1.6;
    }

    @media (max-width: 420px) {
      .wizard-card  { padding: 24px 16px; }
      .step-title   { font-size: 19px; }
      .value-big    { font-size: 26px; }
      .metrics      { grid-template-columns: 1fr; }
      .metric.wide  { grid-column: 1; }
      .toggle-btn   { padding: 18px 8px; font-size: 14px; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <span class="header-sun">☀️</span>
    <h1>Solar-Rechner</h1>
    <p>Lohnt sich eine Photovoltaikanlage für mein Zuhause?</p>
  </div>

  <!-- Wizard -->
  <div id="wizard-section">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="step-label">Schritt 1 von 8</span>
        <span id="step-pct">13 %</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:13%"></div>
      </div>
    </div>
    <div id="wizard-card"></div>
  </div>

  <!-- Results -->
  <div id="results-section" style="display:none">
    <div class="results" id="results-content"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
/* ─────────── DATA ─────────── */
const EINSTRAHLUNG = {
  'Bayern':                   1100,
  'Baden-Württemberg':        1050,
  'Rheinland-Pfalz':          1040,
  'Saarland':                 1060,
  'Brandenburg':              1050,
  'Sachsen':                  1020,
  'Berlin':                   1020,
  'Sachsen-Anhalt':           1030,
  'Mecklenburg-Vorpommern':   1010,
  'Thüringen':                1000,
  'Hessen':                    980,
  'Niedersachsen':             950,
  'Hamburg':                   960,
  'Bremen':                    950,
  'Schleswig-Holstein':        950,
  'Nordrhein-Westfalen':       920,
};

const AUSRICHTUNG = {
  'Nord':     { faktor: 0.50, arrow: '⬆', optimal: false },
  'Nordost':  { faktor: 0.65, arrow: '↗', optimal: false },
  'Ost':      { faktor: 0.80, arrow: '➡', optimal: false },
  'Südost':   { faktor: 0.95, arrow: '↘', optimal: false },
  'Süd':      { faktor: 1.00, arrow: '⬇', optimal: true  },
  'Südwest':  { faktor: 0.95, arrow: '↙', optimal: false },
  'West':     { faktor: 0.80, arrow: '⬅', optimal: false },
  'Nordwest': { faktor: 0.65, arrow: '↖', optimal: false },
};

const DACHFORM = {
  'Satteldach': {
    icon: '🏠',
    beschreibung: 'Zwei Dachseiten, häufigste Form',
    maxOrientierungen: 2,
    m2ProKWp: 7,
    kostenzuschlag: 0,
  },
  'Pultdach': {
    icon: '📐',
    beschreibung: 'Eine geneigte Dachseite',
    maxOrientierungen: 1,
    m2ProKWp: 7,
    kostenzuschlag: 0,
  },
  'Walmdach': {
    icon: '⛺',
    beschreibung: 'Vier Seiten, typisch zwei nutzbar',
    maxOrientierungen: 2,
    m2ProKWp: 7,
    kostenzuschlag: 0,
  },
  'Flachdach': {
    icon: '🏢',
    beschreibung: 'Optimal ausrichtbar, mehr Platzbedarf',
    maxOrientierungen: 0,
    m2ProKWp: 9,
    kostenzuschlag: 200,
  },
};

/* ─────────── STATE ─────────── */
const TOTAL_STEPS = 8;
let state = defaultState();

function defaultState() {
  return {
    step: 1,
    stromverbrauch:   3500,
    dachgroesse:      40,
    dachform:         null,
    dachausrichtung:  [],    // array of 0–2 direction keys
    bundesland:       null,
    strompreis:       0.32,
    batteriespeicher: null,
    eauto:            null,
  };
}

/* ─────────── WIZARD RENDER ─────────── */
const STEPS = [
  renderStromverbrauch,   // 1
  renderDachgroesse,      // 2
  renderDachform,         // 3
  renderDachausrichtung,  // 4
  renderBundesland,       // 5
  renderStrompreis,       // 6
  renderBatteriespeicher, // 7
  renderEauto,            // 8
];

function renderStep() {
  const s = state.step;
  const pct = Math.round((s / TOTAL_STEPS) * 100);
  document.getElementById('step-label').textContent = `Schritt ${s} von ${TOTAL_STEPS}`;
  document.getElementById('step-pct').textContent = `${pct} %`;
  document.getElementById('progress-fill').style.width = `${pct}%`;

  const wrap = document.getElementById('wizard-card');
  const card = document.createElement('div');
  card.className = 'wizard-card step-fade';
  card.innerHTML = STEPS[s - 1]();
  wrap.innerHTML = '';
  wrap.appendChild(card);
  attachListeners(s);
  syncNextBtn();
}

function isValid(s) {
  switch (s) {
    case 1: return state.stromverbrauch >= 500 && state.stromverbrauch <= 15000;
    case 2: return state.dachgroesse >= 5 && state.dachgroesse <= 200;
    case 3: return state.dachform !== null;
    case 4: return state.dachform === 'Flachdach' || state.dachausrichtung.length >= 1;
    case 5: return state.bundesland !== null;
    case 6: return state.strompreis >= 0.10 && state.strompreis <= 0.80;
    case 7: return state.batteriespeicher !== null;
    case 8: return state.eauto !== null;
    default: return false;
  }
}

function syncNextBtn() {
  const btn = document.getElementById('btn-next');
  if (btn) btn.disabled = !isValid(state.step);
}

function goNext() {
  if (!isValid(state.step)) return;
  if (state.step === TOTAL_STEPS) { showResults(); return; }
  let next = state.step + 1;
  // Flachdach: skip Ausrichtung step
  if (state.step === 3 && state.dachform === 'Flachdach') next = 5;
  state.step = next;
  renderStep();
}

function goBack() {
  if (state.step <= 1) return;
  let prev = state.step - 1;
  // Flachdach: skip Ausrichtung step backwards
  if (state.step === 5 && state.dachform === 'Flachdach') prev = 3;
  state.step = prev;
  renderStep();
}

function navHtml(s) {
  return `<div class="nav">
    ${s > 1 ? `<button class="btn-back" onclick="goBack()">← Zurück</button>` : ''}
    <button class="btn-next" id="btn-next" onclick="goNext()" disabled>
      ${s === TOTAL_STEPS ? 'Ergebnis anzeigen ✦' : 'Weiter →'}
    </button>
  </div>`;
}

/* ─────────── STEP RENDERERS ─────────── */
function renderStromverbrauch() {
  return `
    <div class="step-tag">Schritt 1 · Verbrauch</div>
    <div class="step-title">Wie viel Strom verbrauchst du jährlich?</div>
    <div class="step-hint">Steht auf deiner Stromrechnung. Durchschnitt Einfamilienhaus: ca. 3.500 kWh/Jahr.</div>
    <div class="value-row">
      <div class="value-big"><span id="sv-val">${fmt(state.stromverbrauch)}</span></div>
      <span class="value-unit">kWh / Jahr</span>
    </div>
    <input type="range" id="sv-slider" min="500" max="8000" step="100" value="${state.stromverbrauch}">
    <div class="slider-ends"><span>500 kWh</span><span>8.000 kWh</span></div>
    <div class="manual-input">
      <label>Exakter Wert:</label>
      <input type="number" id="sv-num" min="500" max="15000" step="100" value="${state.stromverbrauch}">
      <span>kWh</span>
    </div>
    ${navHtml(1)}`;
}

function renderDachgroesse() {
  return `
    <div class="step-tag">Schritt 2 · Dachfläche</div>
    <div class="step-title">Wie groß ist deine nutzbare Dachfläche?</div>
    <div class="step-hint">Gesamtfläche aller nutzbaren Seiten, ohne Gauben, Schornsteine und verschattete Bereiche.</div>
    <div class="value-row">
      <div class="value-big"><span id="dg-val">${state.dachgroesse}</span></div>
      <span class="value-unit">m²</span>
    </div>
    <input type="range" id="dg-slider" min="5" max="100" step="1" value="${state.dachgroesse}">
    <div class="slider-ends"><span>5 m²</span><span>100 m²</span></div>
    <div class="manual-input">
      <label>Exakter Wert:</label>
      <input type="number" id="dg-num" min="5" max="200" step="1" value="${state.dachgroesse}">
      <span>m²</span>
    </div>
    ${navHtml(2)}`;
}

function renderDachform() {
  const forms = Object.keys(DACHFORM);
  const cells = forms.map(f => {
    const df = DACHFORM[f];
    const active = state.dachform === f ? 'active' : '';
    return `<button class="dachform-btn ${active}" data-form="${f}" onclick="selectDachform('${f}')">
      <span class="df-icon">${df.icon}</span>
      <span class="df-name">${f}</span>
      <span class="df-desc">${df.beschreibung}</span>
    </button>`;
  }).join('');
  return `
    <div class="step-tag">Schritt 3 · Dachform</div>
    <div class="step-title">Welche Form hat dein Dach?</div>
    <div class="step-hint">Die Dachform bestimmt, wie viele Seiten genutzt werden können und wie die Panels montiert werden.</div>
    <div class="dachform-grid">${cells}</div>
    ${navHtml(3)}`;
}

function renderDachausrichtung() {
  const df = DACHFORM[state.dachform];
  const maxSel = df.maxOrientierungen;
  const selected = state.dachausrichtung;
  const count = selected.length;

  const hint = maxSel === 1
    ? 'Dein Pultdach hat eine Dachseite — wähle deren Ausrichtung.'
    : `Du kannst bis zu ${maxSel} Dachseiten wählen. Süd bringt am meisten Ertrag.`;

  const layout = ['Nordwest','Nord','Nordost','West',null,'Ost','Südwest','Süd','Südost'];
  const cells = layout.map(d => {
    if (!d) return `<div class="compass-center">🏠</div>`;
    const a = AUSRICHTUNG[d];
    const isActive = selected.includes(d);
    const isDisabled = !isActive && count >= maxSel;
    return `<button class="dir-btn${isActive ? ' active' : ''}${isDisabled ? ' disabled' : ''}" data-dir="${d}" onclick="selectDir('${d}')">
      <span class="dir-arrow">${a.arrow}</span>
      <span class="dir-label">${d}</span>
      ${a.optimal ? `<span class="optimal-badge">OPTIMAL</span>` : ''}
    </button>`;
  }).join('');

  return `
    <div class="step-tag">Schritt 4 · Ausrichtung</div>
    <div class="step-title">Welche Dachseiten nutzen wir?</div>
    <div class="step-hint">${hint}</div>
    <div class="dir-counter" id="dir-counter">${count} von ${maxSel} Seite${maxSel > 1 ? 'n' : ''} gewählt</div>
    <div class="compass-grid">${cells}</div>
    ${navHtml(4)}`;
}

function renderBundesland() {
  const opts = Object.keys(EINSTRAHLUNG).sort()
    .map(bl => `<option value="${bl}"${state.bundesland === bl ? ' selected' : ''}>${bl}</option>`)
    .join('');
  return `
    <div class="step-tag">Schritt 5 · Standort</div>
    <div class="step-title">In welchem Bundesland wohnst du?</div>
    <div class="step-hint">Die Sonnenstunden variieren je nach Region um bis zu 20 %.</div>
    <div class="select-wrap">
      <select id="bl-select" onchange="selectBl(this.value)">
        <option value="" disabled${!state.bundesland ? ' selected' : ''}>Bundesland wählen …</option>
        ${opts}
      </select>
      <svg class="select-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none">
        <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    ${navHtml(5)}`;
}

function renderStrompreis() {
  const v = state.strompreis;
  return `
    <div class="step-tag">Schritt 6 · Strompreis</div>
    <div class="step-title">Was zahlst du aktuell pro kWh?</div>
    <div class="step-hint">Steht auf deiner Stromrechnung. Bundesdurchschnitt 2024: ca. 32 Cent/kWh.</div>
    <div class="value-row">
      <div class="value-big"><span id="sp-val">${v.toFixed(2)}</span></div>
      <span class="value-unit">€ / kWh</span>
    </div>
    <input type="range" id="sp-slider" min="0.10" max="0.55" step="0.01" value="${v}">
    <div class="slider-ends"><span>0,10 €</span><span>0,55 €</span></div>
    <div class="manual-input">
      <label>Exakter Wert:</label>
      <input type="number" id="sp-num" min="0.10" max="0.80" step="0.01" value="${v.toFixed(2)}">
      <span>€/kWh</span>
    </div>
    ${navHtml(6)}`;
}

function renderBatteriespeicher() {
  const y = state.batteriespeicher === true;
  const n = state.batteriespeicher === false;
  return `
    <div class="step-tag">Schritt 7 · Batteriespeicher</div>
    <div class="step-title">Möchtest du einen Batteriespeicher?</div>
    <div class="step-hint">Ein Speicher erhöht deinen Eigenverbrauch von ~30 % auf ~60 % – lohnenswerter, aber auch teurer.</div>
    <div class="toggle-grid">
      <button class="toggle-btn${y ? ' active-yes' : ''}" data-key="batteriespeicher" data-val="true" onclick="selectToggle('batteriespeicher',true)">
        <span class="toggle-icon">🔋</span>Ja, mit Speicher
      </button>
      <button class="toggle-btn${n ? ' active-no' : ''}" data-key="batteriespeicher" data-val="false" onclick="selectToggle('batteriespeicher',false)">
        <span class="toggle-icon">🔌</span>Nein, ohne
      </button>
    </div>
    ${navHtml(7)}`;
}

function renderEauto() {
  const y = state.eauto === true;
  const n = state.eauto === false;
  return `
    <div class="step-tag">Schritt 8 · Elektroauto</div>
    <div class="step-title">Hast du (oder planst du) ein Elektroauto?</div>
    <div class="step-hint">Ein E-Auto, das du zuhause lädst, erhöht deinen Eigenverbrauch deutlich – und macht eine größere Anlage sinnvoll.</div>
    <div class="toggle-grid">
      <button class="toggle-btn${y ? ' active-yes' : ''}" data-key="eauto" data-val="true" onclick="selectToggle('eauto',true)">
        <span class="toggle-icon">🚗</span>Ja, habe ich
      </button>
      <button class="toggle-btn${n ? ' active-no' : ''}" data-key="eauto" data-val="false" onclick="selectToggle('eauto',false)">
        <span class="toggle-icon">🚶</span>Nein
      </button>
    </div>
    ${navHtml(8)}`;
}

/* ─────────── EVENT HANDLERS ─────────── */
function attachListeners(s) {
  if (s === 1) linkSlider('sv-slider', 'sv-num', 'sv-val', 'stromverbrauch', false, 500, 8000);
  if (s === 2) linkSlider('dg-slider', 'dg-num', 'dg-val', 'dachgroesse', false, 5, 100);
  if (s === 6) linkSlider('sp-slider', 'sp-num', 'sp-val', 'strompreis', true, 0.10, 0.55);
}

function linkSlider(sliderId, numId, displayId, key, isFloat, min, max) {
  const slider  = document.getElementById(sliderId);
  const num     = document.getElementById(numId);
  const display = document.getElementById(displayId);

  function update(v) {
    state[key] = isFloat ? parseFloat(v) : parseInt(v, 10);
    display.textContent = isFloat ? state[key].toFixed(2) : fmt(state[key]);
    syncNextBtn();
  }

  slider.addEventListener('input', e => {
    num.value = e.target.value;
    update(e.target.value);
  });
  num.addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v)) {
      update(v);
      if (v >= min && v <= max) slider.value = v;
    }
  });
}

function selectDachform(f) {
  state.dachform = f;
  const maxSel = DACHFORM[f].maxOrientierungen;
  // Trim selection if new form allows fewer orientations
  if (state.dachausrichtung.length > maxSel) {
    state.dachausrichtung = state.dachausrichtung.slice(0, maxSel);
  }
  if (f === 'Flachdach') state.dachausrichtung = [];
  document.querySelectorAll('.dachform-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.form === f);
  });
  syncNextBtn();
}

function selectDir(d) {
  const maxSel = DACHFORM[state.dachform].maxOrientierungen;
  const idx = state.dachausrichtung.indexOf(d);

  if (idx >= 0) {
    state.dachausrichtung.splice(idx, 1);
  } else if (state.dachausrichtung.length < maxSel) {
    state.dachausrichtung.push(d);
  }

  const count = state.dachausrichtung.length;
  document.querySelectorAll('.dir-btn').forEach(b => {
    const bDir = b.dataset.dir;
    const isActive = state.dachausrichtung.includes(bDir);
    const isDisabled = !isActive && count >= maxSel;
    b.classList.toggle('active', isActive);
    b.classList.toggle('disabled', isDisabled);
  });
  const counter = document.getElementById('dir-counter');
  if (counter) counter.textContent = `${count} von ${maxSel} Seite${maxSel > 1 ? 'n' : ''} gewählt`;

  syncNextBtn();
}

function selectBl(v) {
  state.bundesland = v || null;
  syncNextBtn();
}

function selectToggle(key, val) {
  state[key] = val;
  document.querySelectorAll(`.toggle-btn[data-key="${key}"]`).forEach(b => {
    const bVal = b.dataset.val === 'true';
    b.classList.remove('active-yes', 'active-no');
    if (bVal === val) b.classList.add(val ? 'active-yes' : 'active-no');
  });
  syncNextBtn();
}

// Global Enter key handler
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('wizard-section').style.display !== 'none') {
    goNext();
  }
});

/* ─────────── CALCULATION ─────────── */
function calcAusrFaktor() {
  if (state.dachform === 'Flachdach') return 1.0;
  if (state.dachausrichtung.length === 0) return 1.0;
  if (state.dachausrichtung.length === 1) return AUSRICHTUNG[state.dachausrichtung[0]].faktor;
  const f1 = AUSRICHTUNG[state.dachausrichtung[0]].faktor;
  const f2 = AUSRICHTUNG[state.dachausrichtung[1]].faktor;
  return (f1 + f2) / 2;
}

function calculate() {
  const { stromverbrauch, dachgroesse, dachform, bundesland, strompreis, batteriespeicher, eauto } = state;

  const df          = DACHFORM[dachform];
  const einstrahlung = EINSTRAHLUNG[bundesland];
  const ausrFaktor  = calcAusrFaktor();
  const m2ProKWp    = df.m2ProKWp;

  // Anlagengröße (kWp)
  const maxDach      = dachgroesse / m2ProKWp;
  let bedarf         = stromverbrauch / 1000 + (eauto ? 2 : 0);
  let anlagengroesse = Math.min(maxDach, bedarf);
  anlagengroesse     = Math.max(1, Math.min(anlagengroesse, 20));
  anlagengroesse     = Math.round(anlagengroesse * 10) / 10;

  // Jahresertrag (kWh)
  const jahresertrag = anlagengroesse * einstrahlung * ausrFaktor;

  // Eigenverbrauch (kWh)
  const evQuote = batteriespeicher ? 0.60 : 0.30;
  let ev = jahresertrag * evQuote + (eauto ? 1500 : 0);
  ev = Math.min(ev, jahresertrag);

  // Einspeisung & Vergütung
  const einspeisung = jahresertrag - ev;
  const vergSatz    = anlagengroesse <= 10 ? 0.082 : 0.071;

  // Jahresersparnis (€)
  const jahresersparnis = ev * strompreis + einspeisung * vergSatz;

  // Kosten (€)
  const anlagenkosten  = anlagengroesse * (1300 + df.kostenzuschlag);
  const batteriekosten = batteriespeicher ? anlagengroesse * 900 : 0;
  const gesamtkosten   = anlagenkosten + batteriekosten;

  // Amortisation
  const amortisation = gesamtkosten / jahresersparnis;

  // Gewinn 25 Jahre (2 % Strompreissteigerung p.a.)
  const ersparnis25 = jahresersparnis * ((Math.pow(1.02, 25) - 1) / 0.02);
  const gewinn25    = ersparnis25 - gesamtkosten;

  // Kumulierter Verlauf (Jahr 0–25)
  const kumData = [-gesamtkosten];
  let kum = -gesamtkosten;
  for (let y = 1; y <= 25; y++) {
    kum += jahresersparnis * Math.pow(1.02, y - 1);
    kumData.push(Math.round(kum));
  }

  // Verdict
  let verdict;
  if (amortisation <= 14 && gewinn25 > 0) verdict = 'good';
  else if (amortisation <= 22 && gewinn25 > 0) verdict = 'ok';
  else verdict = 'bad';

  // Ausrichtungstext für Ergebnisanzeige
  const ausrText = dachform === 'Flachdach'
    ? 'Optimal (Montagegestell)'
    : state.dachausrichtung.join(' + ');

  return {
    anlagengroesse,
    jahresertrag:    Math.round(jahresertrag),
    eigenverbrauch:  Math.round(ev),
    einspeisung:     Math.round(einspeisung),
    jahresersparnis: Math.round(jahresersparnis),
    anlagenkosten:   Math.round(anlagenkosten),
    batteriekosten:  Math.round(batteriekosten),
    gesamtkosten:    Math.round(gesamtkosten),
    amortisation:    Math.round(amortisation * 10) / 10,
    gewinn25:        Math.round(gewinn25),
    verdict,
    kumData,
    m2ProKWp,
    ausrText,
    dachform,
    kostenzuschlag: df.kostenzuschlag,
  };
}

/* ─────────── RESULTS ─────────── */
function showResults() {
  const r = calculate();

  document.getElementById('wizard-section').style.display = 'none';
  document.getElementById('results-section').style.display = 'block';

  const vMap = {
    good: { icon: '🎉', title: 'Lohnt sich!',
      sub: `Sehr gute Entscheidung: Die Anlage amortisiert sich in ca. ${r.amortisation} Jahren und bringt dir über 25 Jahre einen soliden Gewinn.` },
    ok:   { icon: '👍', title: 'Lohnt sich!',
      sub: `Die Anlage rechnet sich in ${r.amortisation} Jahren – bei einer Lebensdauer von 25–30 Jahren ein gutes Ergebnis.` },
    bad:  { icon: '🤔', title: 'Rechnet sich kaum',
      sub: `Mit einer Amortisationszeit von ${r.amortisation} Jahren ist die Investition unter den aktuellen Bedingungen wenig sinnvoll.` },
  };
  const vd = vMap[r.verdict];
  const gewinnPos = r.gewinn25 >= 0;

  const kostenSubtext = r.batteriekosten > 0
    ? `${eur(r.anlagenkosten)} Anlage + ${eur(r.batteriekosten)} Speicher`
    : r.kostenzuschlag > 0 ? `inkl. Montagegestell (${r.dachform})` : 'inkl. Montage';

  document.getElementById('results-content').innerHTML = `
    <div class="verdict ${r.verdict}">
      <span class="verdict-icon">${vd.icon}</span>
      <div class="verdict-title">${vd.title}</div>
      <div class="verdict-sub">${vd.sub}</div>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="m-label">Anlagengröße</div>
        <div class="m-value">${r.anlagengroesse} kWp</div>
        <div class="m-sub">≈ ${Math.round(r.anlagengroesse * r.m2ProKWp)} m² Dachfläche</div>
      </div>
      <div class="metric">
        <div class="m-label">Jährliche Ersparnis</div>
        <div class="m-value">${eur(r.jahresersparnis)}</div>
        <div class="m-sub">Eigenverbrauch + Einspeisung</div>
      </div>
      <div class="metric">
        <div class="m-label">Gesamtkosten</div>
        <div class="m-value">${eur(r.gesamtkosten)}</div>
        <div class="m-sub">${kostenSubtext}</div>
      </div>
      <div class="metric">
        <div class="m-label">Amortisation</div>
        <div class="m-value">${r.amortisation} Jahre</div>
        <div class="m-sub">Lebensdauer: 25–30 Jahre</div>
      </div>
      <div class="metric wide">
        <div class="m-label">Gewinn über 25 Jahre</div>
        <div class="m-value ${gewinnPos ? 'pos' : 'neg'}">${eur(r.gewinn25)}</div>
        <div class="m-sub">Nach Abzug aller Kosten · inkl. 2 % jährl. Strompreissteigerung</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-label">Kapitalentwicklung über 25 Jahre</div>
      <canvas id="amort-chart" height="210"></canvas>
    </div>

    <button class="details-toggle" onclick="toggleDetails()" id="details-toggle-btn">
      <span>Berechnungsdetails anzeigen</span>
      <span id="details-arrow">▾</span>
    </button>
    <div class="details-panel" id="details-panel">
      <div class="detail-row"><span>Dachform</span><span>${r.dachform}</span></div>
      <div class="detail-row"><span>Ausrichtung</span><span>${r.ausrText}</span></div>
      <div class="detail-row"><span>Jahresertrag</span><span>${fmt(r.jahresertrag)} kWh</span></div>
      <div class="detail-row"><span>Eigenverbrauch</span><span>${fmt(r.eigenverbrauch)} kWh (${Math.round(r.eigenverbrauch/r.jahresertrag*100)} %)</span></div>
      <div class="detail-row"><span>Einspeisung</span><span>${fmt(r.einspeisung)} kWh</span></div>
      <div class="detail-row"><span>Einspeisevergütung</span><span>${r.anlagengroesse <= 10 ? '8,2' : '7,1'} Ct/kWh</span></div>
      <div class="detail-row"><span>Anlage (${r.anlagengroesse} kWp × ${1300 + r.kostenzuschlag} €/kWp)</span><span>${eur(r.anlagenkosten)}</span></div>
      ${r.batteriekosten > 0 ? `<div class="detail-row"><span>Batteriespeicher</span><span>${eur(r.batteriekosten)}</span></div>` : ''}
      <div class="detail-row"><span>Strompreis-Steigerung (Annahme)</span><span>2 % / Jahr</span></div>
    </div>

    <button class="btn-reset" onclick="resetApp()">↩ Neue Berechnung starten</button>
    <p class="disclaimer">Alle Werte sind Schätzungen auf Basis von Durchschnittswerten und ohne Gewähr.<br>Für eine verbindliche Planung empfehlen wir die Beratung durch einen zertifizierten Solarteur.</p>
  `;

  renderChart(r);
}

function renderChart(r) {
  const labels = ['Start', ...Array.from({length: 25}, (_, i) => `Jahr ${i+1}`)];
  const data   = r.kumData;

  const colors = data.map(v => v < 0
    ? 'rgba(239,68,68,0.55)'
    : 'rgba(34,197,94,0.60)'
  );

  Chart.defaults.color = '#64748b';

  new Chart(document.getElementById('amort-chart').getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Kapitalentwicklung',
          data,
          backgroundColor: colors,
          borderRadius: 3,
          borderSkipped: false,
        },
        {
          label: 'Break-Even',
          data: Array(26).fill(0),
          type: 'line',
          borderColor: 'rgba(245,158,11,0.7)',
          borderWidth: 1.5,
          borderDash: [6, 4],
          pointRadius: 0,
          tension: 0,
        }
      ]
    },
    options: {
      responsive: true,
      animation: { duration: 600 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => ctx[0].datasetIndex === 1 ? null : ctx[0].label,
            label: ctx => {
              if (ctx.datasetIndex === 1) return null;
              const v = ctx.raw;
              return v >= 0
                ? `Gewinn: ${eur(v)}`
                : `Noch ${eur(-v)} bis Break-Even`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#475569',
            font: { size: 10 },
            maxTicksLimit: 9,
            maxRotation: 45,
          },
          grid: { color: 'rgba(255,255,255,0.04)' }
        },
        y: {
          ticks: {
            color: '#475569',
            font: { size: 10 },
            callback: v => eur(v),
          },
          grid: { color: 'rgba(255,255,255,0.06)' }
        }
      }
    }
  });
}

function toggleDetails() {
  const panel = document.getElementById('details-panel');
  const arrow = document.getElementById('details-arrow');
  const btn   = document.getElementById('details-toggle-btn');
  const open  = panel.classList.toggle('open');
  arrow.textContent = open ? '▴' : '▾';
  btn.querySelector('span').textContent = open ? 'Berechnungsdetails ausblenden' : 'Berechnungsdetails anzeigen';
}

function resetApp() {
  state = defaultState();
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('wizard-section').style.display  = 'block';
  renderStep();
}

/* ─────────── HELPERS ─────────── */
function eur(n) {
  return new Intl.NumberFormat('de-DE', {
    style: 'currency', currency: 'EUR', maximumFractionDigits: 0
  }).format(n);
}
function fmt(n) {
  return new Intl.NumberFormat('de-DE').format(n);
}

/* ─────────── BOOT ─────────── */
renderStep();
</script>
